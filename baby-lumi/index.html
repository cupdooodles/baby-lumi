<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lumi Run</title>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@700&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--sky:#cfe3fb;--sky2:#e6f0fd;--brown:#8a5a36;--brown-d:#5e3a20;--cream:#fff4d6;--pink:#ff7eb6;--page:#fff;--ink:#4b2f1c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--page);font-family:'Lexend',system-ui,sans-serif;font-weight:700;color:var(--ink);overflow:hidden;touch-action:manipulation}
body{display:flex;align-items:center;justify-content:center}
#game{position:relative;width:min(100vw,calc(100vh*480/560));aspect-ratio:480/560;container-type:inline-size;background:#fff;overflow:hidden;user-select:none;-webkit-user-select:none}
canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
#score{position:absolute;top:3.5cqw;right:4cqw;font-size:5cqw;color:var(--brown-d);z-index:2}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5cqw;z-index:3;text-align:center;padding:6cqw}
#over{background:rgba(255,255,255,.5);display:none}
.btn{font-family:'Press Start 2P',ui-monospace,monospace;font-weight:400;font-size:3.4cqw;line-height:1.3;color:#fff;background:none;border:4.4cqw solid transparent;border-image:url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAkAAAAJCAYAAADgkQYQAAAASUlEQVR4nGNkgIIqL43/DGigbdsNRgYGBgZGZAV2FkZwBYdOnIMrZMSmAF0hEy4FyOJMWGXRAPGKYHbjdBPMm+gKUXwHE8QXTgAARyLUMCKlaAAAAABJRU5ErkJggg==) 4 fill/4.4cqw stretch;image-rendering:pixelated;padding:.4cqw 1.2cqw;cursor:pointer;box-shadow:none;text-transform:none}
.btn:active{transform:translateY(.8cqw)}
#play{font-family:'Press Start 2P',ui-monospace,monospace;font-size:4cqw;font-weight:400}
.btn:focus-visible{outline:.8cqw solid var(--pink);outline-offset:1cqw}
#hl{position:static;width:30cqw;height:auto;image-rendering:pixelated}
.cap{font-size:2.6cqw;line-height:1.6;max-width:70cqw;margin:0}
h1{font-family:'Press Start 2P',ui-monospace,monospace;font-weight:400;font-size:7.5cqw;margin:0;color:var(--brown-d);line-height:1.3}
.row{display:flex;gap:3cqw;flex-wrap:nowrap;justify-content:center;align-items:center}
.row .btn{width:41cqw;font-size:3cqw;padding:.4cqw 0}
#fs{font-family:'Press Start 2P',ui-monospace,monospace;font-weight:400;font-size:4.5cqw;margin:0;color:var(--brown-d)}
</style></head><body>
<div id="game">
<canvas id="c" width="960" height="1120"></canvas>
<div id="score">0</div>
<div class="screen" id="home">
 <button class="btn" id="play">let’s play!</button>
 <canvas id="hl" width="93" height="160" aria-label="Lumi standing"></canvas>

</div>
<div class="screen" id="over">
 <h1>GAME OVER</h1>
 <p id="fs">score 0</p>
 <div class="row"><button class="btn" id="again">PLAY AGAIN</button><button class="btn" id="homeBtn">HOME</button></div>
</div>
</div>

  for(const o of objs){
    if(o.k==='ob'&&!o.passed&&o.x+o.w<lumi.x){o.passed=true;passed++}
    const ob={x:o.x+(o.k==='ob'?9:6),y:G-o.h-o.lift+(o.k==='ob'?8:4),w:o.w-(o.k==='ob'?18:12),h:o.h-(o.k==='ob'?12:8)};
    if(o.k==='tea'){
      if(!o.got&&!over&&hit(lb,ob)){o.got=true;score+=10;$('score').textContent=score;hearts.push({x:lumi.x+lumi.w/2,y:G-lumi.h+lumi.y-6,t:0})}
    }else if(!over&&hit(lb,ob)){over=true}
  }
  objs=objs.filter(o=>o.x>-100&&!o.got);
  for(const h of hearts)h.t+=dt;hearts=hearts.filter(h=>h.t<.9);
  if(over){$('fs').textContent='SCORE '+score;show('over')}
}
function draw(){
  ctx.clearRect(0,0,W,H);ctx.imageSmoothingEnabled=false;
  ctx.fillStyle='#000';ctx.fillRect(0,G,W,2);
  for(const o of objs){const im=I[o.img];ctx.drawImage(im,o.x,G-o.h-o.lift,o.w,o.h)}
  const jm=lumi.y<0,im=I[jm?'jump':'walk'],w=im.width*.5,hh=im.height*.5,y0=G-hh+lumi.y;
  if(jm)ctx.drawImage(im,lumi.x,y0,w,hh);
  else{const ly=Math.round(im.height*LEG),sh=hh*ly/im.height,lh=hh-sh,lw=im.height-ly,hw=im.width/2,st=Math.floor(anim/.14)%2;
   ctx.drawImage(im,0,0,im.width,ly,lumi.x,y0,w,sh);
   ctx.drawImage(im,0,ly,hw,lw,lumi.x+(st?-2:2),y0+sh-(st?0:2),w/2,lh);
   ctx.drawImage(im,hw,ly,hw,lw,lumi.x+w/2+(st?2:-2),y0+sh-(st?2:0),w/2,lh)}
  for(const h of hearts){const p=h.t/.9;ctx.globalAlpha=1-p*p;const s=p<.2?18+p*60:30;ctx.drawImage(I.heart,h.x-s/2+8,h.y-p*45-s,s*I.heart.width/I.heart.height,s)}
  ctx.globalAlpha=1;
}
function drawHome(t){const hc=$('hl'),im=I.stand;if(hc.width!==im.width){hc.width=im.width;hc.height=im.height}const c=hc.getContext('2d');c.imageSmoothingEnabled=false;c.clearRect(0,0,hc.width,hc.height);
  const ly=Math.round(im.height*LEG),dy=Math.floor(t/450)%2?4:0;
  c.drawImage(im,0,ly,im.width,im.height-ly,0,ly,im.width,im.height-ly);
  c.drawImage(im,0,0,im.width,ly,0,dy,im.width,ly)}
function loop(t){
  const dt=Math.min(.033,(t-last)/1000||0);last=t;
  if(state==='play')update(dt);
  if(state!=='home')draw();else{ctx.clearRect(0,0,W,H);drawHome(t)}
  requestAnimationFrame(loop);
}
addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();jump()}});
$('game').addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;jump()});
$('play').onclick=startGame;$('again').onclick=startGame;$('homeBtn').onclick=()=>show('home');
reset();show('home');init();
</script></body></html>
