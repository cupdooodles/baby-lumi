<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lumi Run</title>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--sky:#cfe3fb;--sky2:#e6f0fd;--brown:#8a5a36;--brown-d:#5e3a20;--cream:#fff4d6;--pink:#ff7eb6;--page:#fff;--ink:#4b2f1c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--page);font-family:'Lexend',system-ui,sans-serif;font-weight:700;color:var(--ink);overflow:hidden;touch-action:manipulation}
body{display:flex;align-items:center;justify-content:center;width:100%;height:100dvh;margin:0 auto}
/* Layout: top padding 117px (130 - 10%), game 560px (unchanged), bottom padding 164.45px (149.5 + 10%). Total = 841.45 */
#screen{position:relative;flex:none;width:min(100vw,calc(100vh*480/841.45),calc(100dvh*480/841.45));aspect-ratio:480/841.45;background:#fff;display:flex;align-items:flex-start;justify-content:center;overflow:hidden;touch-action:manipulation}
#game{position:relative;flex:none;width:100%;margin-top:24.375%;aspect-ratio:480/560;container-type:inline-size;background:#fff;overflow:hidden;user-select:none;-webkit-user-select:none}
canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
#score{position:absolute;top:3.5cqw;right:4cqw;font-size:5cqw;color:var(--brown-d);z-index:2}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5cqw;z-index:3;text-align:center;padding:6cqw}
#over{background:rgba(255,255,255,.5);display:none}
#credit{position:absolute;bottom:2.5cqw;right:3.5cqw;font-family:'Press Start 2P',ui-monospace,monospace;font-size:1.9cqw;color:#c9a27c;font-weight:400;opacity:.7;z-index:4;pointer-events:none}
.btn{font-family:'Press Start 2P',ui-monospace,monospace;font-weight:400;font-size:3.4cqw;line-height:1.3;color:#fff;background:none;border:4.4cqw solid transparent;border-image:url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAkAAAAJCAYAAADgkQYQAAAAR0lEQVR42mNkgILKEPP/DGigfc1JRgYGBgZGZAUmKuJwBWfuvIQrZMSmAF0hEy4FyOJMDEQA4hXB7MbpJpg30RWi+I6YcAIA9IAjLlxy5v0AAAAASUVORK5CYII=) 4 fill/4.4cqw stretch;image-rendering:pixelated;padding:.4cqw 1.2cqw;cursor:pointer;box-shadow:none;text-transform:none}
.btn:active{transform:translateY(.8cqw)}
#play{font-family:'Press Start 2P',ui-monospace,monospace;font-size:4cqw;font-weight:400}
.btn:focus-visible{outline:.8cqw solid var(--pink);outline-offset:1cqw}
#hl{position:static;width:30cqw;height:auto;image-rendering:pixelated}
#bubble{position:static;width:76cqw;height:auto;image-rendering:pixelated;margin-bottom:-3cqw}
.cap{font-size:2.6cqw;line-height:1.6;max-width:70cqw;margin:0}
h1{font-family:'Press Start 2P',ui-monospace,monospace;font-weight:400;font-size:7.5cqw;margin:0;color:var(--brown-d);line-height:1.3}
.row{display:flex;gap:3cqw;flex-wrap:nowrap;justify-content:center;align-items:center}
.row .btn{width:41cqw;font-size:3cqw;padding:.4cqw 0}
#fs{font-family:'Press Start 2P',ui-monospace,monospace;font-weight:400;font-size:4.5cqw;margin:0;color:var(--brown-d)}
</style></head><body>
<div id="screen">
<div id="game">
<canvas id="c" width="960" height="1120"></canvas>
<div id="score">0</div>
<div id="credit">@cupdooodles_</div>
<div class="screen" id="home">
 <canvas id="bubble" aria-label="Happy birthday, mommies!"></canvas>
 <canvas id="hl" width="93" height="160" aria-label="Lumi standing"></canvas>
 <button class="btn" id="play">let’s play!</button>

</div>
<div class="screen" id="over">
 <h1>GAME OVER</h1>
 <p id="fs">score 0</p>
 <div class="row"><button class="btn" id="again">PLAY AGAIN</button><button class="btn" id="homeBtn">HOME</button></div>
</div>
</div>

const BOX=o=>({x:o.x+(o.k==='ob'?9:6),y:G-o.h-o.lift+(o.k==='ob'?8:4),w:o.w-(o.k==='ob'?18:12),h:o.h-(o.k==='ob'?12:8)});
const ov=(a,b,m)=>a.x<b.x+b.w+m&&a.x+a.w+m>b.x&&a.y<b.y+b.h+m&&a.y+a.h+m>b.y;
function mkOb(X,off,lv){const kind=pickKind(),s=sprite(kind,kind==='shrimp'?38:51);return{k:'ob',x:X+off,w:s.w,h:s.h,lift:LV[lv],img:kind,lv}}
function pickCollectible(){const a=Object.keys(CAP).filter(k=>cnt[k]<CAP[k]);const l=a.length?a:Object.keys(CAP);return l[Math.random()*l.length|0]}
function mkTea(X,off,lift){const kind=pickCollectible(),t=sprite(kind,COLH);return{k:'tea',x:X+off,w:t.w,h:COLH,lift,img:kind,got:false}}
const pairGap=(a,b)=>a===2?(b===2?speed*.3+70:speed*.5+90):speed*.85+60+(b===2?speed*.1:0);
function makeSeq(X,force){

  recent.push(type);if(recent.length>2)recent.shift();

  else if(type==='obTea'){const o=mkOb(X,0,lvRand());L.push(o);

    let off=0;for(let i=0;i<n;i++){L.push(mkOb(X,off,lvs[i]));if(i<n-1)off+=pairGap(lvs[i],lvs[i+1])}}

  for(const t of L.filter(o=>o.k==='tea')){let ok=false;for(let i=0;i<8&&!ok;i++){const b=BOX(t);if(L.some(o=>o.k==='ob'&&ov(BOX(o),b,14)))t.x+=18;else ok=true}if(!ok)L.splice(L.indexOf(t),1)}
  {const R=L.filter(o=>o.k==='tea');if(R.length){ // keep the whole sequence intact, just slide it further out if its first reward would sit too close to the previous one

    if(sh>0)for(const o of L)o.x+=sh;lastRewW=scrollDist+last+sh}}
  let lastOb=null,end=0;for(const o of L){end=Math.max(end,o.x-X+o.w);if(o.k==='ob'&&(!lastOb||o.x>lastOb.x))lastOb=o}
  let gap;
  if(!lastOb)gap=end+sp*.2+rnd(40,110);
  else{const min=lastOb.lv===2?sp*.5+90:sp*.85+60,r=Math.random(),b=r<.35?[0,.15]:r<.8?[.15,.45]:[.45,.9];
    gap=Math.max(lastOb.x-X+min+rnd(b[0],b[1])*sp+(big?rnd(.5,.9)*sp:0),end+30)}

}
function spawn2(){const q=makeSeq(W+20,nSp===0?'teaOnly':nSp===1?'single':null);for(const o of q.objs)objs.push(o);timer=q.gap;nSp++;if(q.objs.some(o=>o.k==='tea'))maybeOnion()}
function maybeOnion(){
  // roll only when a collectible was just generated, respect the minimum spacing, and never show two at once
  if(sinceOnion<ONION_MIN_DIST||Math.random()>=ONION_CHANCE||objs.some(q=>q.k==='onion'))return;
  spawnOnion();
}
function spawnOnion(){
  // 50/50: floor level (collected while running) or jumping zone (same reachable heights as the milk teas)
  // it is placed clear of every object already on/near screen (same clearances the sequence spawner uses)
  const sp=speed,o=sprite('onion',TEAH),hi=Math.random()<.5,lift=hi?hiLift():0;let x=W+20;
  for(const q of objs){const m=q.k==='ob'?(q.lv===2?sp*.5+90:sp*.85+60):(hi?60:30);x=Math.max(x,q.x+q.w+m)}
  objs.push({k:'onion',x,w:o.w,h:TEAH,lift,img:'onion',got:false});

}
function spawn(){
  const r=Math.random();
  if(r<.62){
    const s=sprite('shrimp',50),high=Math.random()<(lastHigh?.3:.6);lastHigh=high;lastTea=false;objs.push({k:'ob',x:W+20,w:s.w,h:50,lift:high?115:0,img:'shrimp'});
    if(!high&&Math.random()<.3){const kd=pickCollectible(),t=sprite(kd,COLH);objs.push({k:'tea',x:W+20+s.w/2-t.w/2,w:t.w,h:COLH,lift:105,img:kd,got:false})}
  }else{
    lastTea=true;const kd=pickCollectible(),t=sprite(kd,COLH);objs.push({k:'tea',x:W+20,w:t.w,h:COLH,lift:Math.random()<.5?0:70+Math.random()*40,img:kd,got:false});
  }
  {const mn=(speed*.8+110)*(lastTea?.7:1);timer=mn+(Math.random()<.4?Math.random()*speed*.15:speed*.2+Math.random()*speed*.9)}
}
const hit=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
const BWR=140/230,BODY=32/46;
// Original balloon movement: floats straight up from where Lumi collected the item, with a gentle side-to-side sway. Overlapping other balloons is fine.
function bpos(b,t){const p=t/BT,h=BH,w=h*BWR,e=1-(1-p)*(1-p),
  x=b.x+Math.sin(p*5+b.sw)*4,y=b.y-e*230-h*.35;return{x,y,L:Math.round(x-w/2),T:Math.round(y-h),w,h}}
function collect(kind){
  const n=cnt[kind];cnt[kind]=n+1; // keeps counting: after the last photo the sequence loops back to photo 1
  // photo order: 1, 2, 3 ... then loops. If that photo did not load, pick any photo that did load from the same folder
  let ph=PH[kind][n%CAP[kind]];
  if(!(ph&&ph.im&&ph.im.width)){const ok=PH[kind].filter(e=>e&&e.im&&e.im.width);ph=ok.length?ok[Math.random()*ok.length|0]:null}
  // if no photo loaded at all (e.g. the images folder is missing), the balloon uses the placeholder
  const nb={kind,ph,x:lumi.x+lumi.w/2,y:G-lumi.h+lumi.y,t:0,sw:Math.random()*6.28};balloons.push(nb);
}
function update(dt){
  speed=Math.min(MAXS,speed+ACC*dt);
  lumi.vy+=2400*dt;lumi.y=Math.min(0,lumi.y+lumi.vy*dt);if(lumi.y===0)lumi.vy=0;
  anim+=dt;
  timer-=speed*dt;scrollDist+=speed*dt;sinceOnion+=speed*dt;if(timer<=0)spawn2();
  const lb={x:lumi.x+10,y:G-lumi.h+lumi.y+12,w:lumi.w-20,h:lumi.h-16};
  for(const o of objs)o.x-=speed*dt;
  for(const o of objs)if(o.k==='ob'&&hit(lb,{x:o.x+9,y:G-o.h-o.lift+8,w:o.w-18,h:o.h-12}))over=true;
  for(const o of objs){
    if(o.k==='ob'&&!o.passed&&o.x+o.w<lumi.x){o.passed=true;passed++}
    const ob={x:o.x+(o.k==='ob'?9:6),y:G-o.h-o.lift+(o.k==='ob'?8:4),w:o.w-(o.k==='ob'?18:12),h:o.h-(o.k==='ob'?12:8)};
    if(o.k==='tea'){
      if(!o.got&&!over&&hit(lb,ob)){o.got=true;score+=PTS[o.img];$('score').textContent=score;collect(o.img)}
    }else if(o.k==='onion'){
      if(!o.got&&!over&&hit(lb,ob)){o.got=true;score+=100;$('score').textContent=score;pops.push({x:o.x+o.w/2,y:G-o.h-o.lift-6,t:0})}
    }else if(!over&&hit(lb,ob)){over=true}
  }

// "+100" as hand-built pixel art (no web font needed): yellow fill, black outline exactly 1 grid pixel thick.
// 1 grid pixel = 1.5 game units = the same width as Lumi's outline (one of her 3-px art pixels drawn at 0.5 scale).
const POPG={'+':['......','..##..','..##..','######','..##..','..##..','......'],'1':['..##..','.###..','..##..','..##..','..##..','..##..','.####.'],'0':['.####.','##..##','##..##','##..##','##..##','##..##','.####.']};
let popSpr=null;
function mkPop(){
  const txt='+100',F=2,P=1,w=(6*txt.length+txt.length-1)*F,h=7*F,Wd=w+2*P,Ht=h+2*P;
  const m=Array.from({length:Ht},()=>Array(Wd).fill(0));
  txt.split('').forEach((ch,ci)=>POPG[ch].forEach((row,ry)=>{for(let rx=0;rx<6;rx++)if(row[rx]==='#')for(let a=0;a<F;a++)for(let b=0;b<F;b++)m[P+ry*F+b][P+(ci*7+rx)*F+a]=1}));
  const c=document.createElement('canvas');c.width=Wd;c.height=Ht;const x=c.getContext('2d');
  for(let y=0;y<Ht;y++)for(let X=0;X<Wd;X++){
    if(m[y][X]){x.fillStyle='#ffd23f';x.fillRect(X,y,1,1);continue}
    let near=false;for(let dy=-1;dy<=1&&!near;dy++)for(let dx=-1;dx<=1;dx++)if(m[y+dy]&&m[y+dy][X+dx]){near=true;break}
    if(near){x.fillStyle='#000';x.fillRect(X,y,1,1)}
  }
  return c;
}
const BT=3.7,BH=115,PBOX=[11/28,16/46]; // PBOX = photo circle radius (fraction of balloon width) and centre-y (fraction of balloon height) // balloon float time (s), css height, photo box (w frac, h frac, centre-y frac)
// PLACEHOLDER: checkerboard that fills the exact photo circle. It is shown until the real photo (images/miu or images/lena) has loaded,
// then the real 1:1 photo replaces it automatically, filling the same circle edge to edge.
let phSpr=null;
function mkPlaceholder(){const n=110,c=document.createElement('canvas');c.width=c.height=n;const x=c.getContext('2d'),k=n/10;
  for(let r=0;r<10;r++)for(let q=0;q<10;q++){x.fillStyle=(r+q)%2?'#d9d9d9':'#f4f4f4';x.fillRect(q*k,r*k,k,k)}return c}
function drawBalloonPhoto(cx,cy,r,img){
  ctx.save();ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.clip();
  if(img&&img.width){const sc=Math.max(2*r/img.width,2*r/img.height),dw=img.width*sc,dh=img.height*sc;ctx.imageSmoothingEnabled=true;ctx.drawImage(img,cx-dw/2,cy-dh/2,dw,dh)}
  else{if(!phSpr)phSpr=mkPlaceholder();ctx.drawImage(phSpr,cx-r,cy-r,2*r,2*r)}
  ctx.restore();ctx.imageSmoothingEnabled=false;
}
// The balloon's brown/purple fill is removed: the photo fills the whole balloon body, and only the outline, knot and string are drawn on top.
const BFILL=158,bParts={},bc=document.createElement('canvas');bc.width=140;bc.height=230;const bx=bc.getContext('2d');
function balloonParts(name){
  if(bParts[name])return bParts[name];
  const im=I[name],mk=()=>{const c=document.createElement('canvas');c.width=im.width;c.height=im.height;return c},src=mk(),sx=src.getContext('2d');sx.drawImage(im,0,0);
  const px=sx.getImageData(0,0,im.width,im.height).data,cn={};
  for(let i=0;i<px.length;i+=4)if(px[i+3]){const k=px[i]+','+px[i+1]+','+px[i+2];cn[k]=(cn[k]||0)+1}
  const fillCols=Object.keys(cn).sort((a,b)=>cn[b]-cn[a]).slice(0,2),fc=mk(),oc=mk(),fx=fc.getContext('2d'),ox=oc.getContext('2d'),fd=fx.createImageData(im.width,im.height),od=ox.createImageData(im.width,im.height);
  for(let i=0;i<px.length;i+=4){if(!px[i+3])continue;const y=Math.floor(i/4/im.width),t=(y<BFILL&&fillCols.includes(px[i]+','+px[i+1]+','+px[i+2]))?fd:od;t.data[i]=px[i];t.data[i+1]=px[i+1];t.data[i+2]=px[i+2];t.data[i+3]=255}
  fx.putImageData(fd,0,0);ox.putImageData(od,0,0);

}
function drawBalloon(b){
  if(b.t<0)return;
  const p=b.t/BT,name=b.kind==='bear'?'bln_brown':'bln_purple',parts=balloonParts(name),q=bpos(b,b.t),w=q.w,h=q.h,L=q.L,T=q.T;
  let img=b.ph&&b.ph.im;if(!(img&&img.width)){if(!phSpr)phSpr=mkPlaceholder();img=phSpr}
  bx.clearRect(0,0,140,230);bx.imageSmoothingEnabled=true;
  const sc=Math.max(140/img.width,BFILL/img.height),dw=img.width*sc,dh=img.height*sc;
  bx.drawImage(img,70-dw/2,BFILL/2-dh/2,dw,dh);

  ctx.globalAlpha=p<.75?1:1-(p-.75)/.25;

  ctx.drawImage(parts.out,L,T,w,h);
  ctx.globalAlpha=1;
}
function draw(){
  ctx.clearRect(0,0,W,H);ctx.imageSmoothingEnabled=false;
  ctx.fillStyle='#000';ctx.fillRect(0,G,W,2);
  for(const o of objs){const im=I[o.img];if(o.k==='onion'&&!o.got){const f=Math.floor(performance.now()/170)%4;ctx.drawImage(I.shine,f*70,0,70,84,Math.round(o.x)-14,Math.round(G-o.h-o.lift)-14,70,84)}ctx.drawImage(im,o.x,G-o.h-o.lift,o.w,o.h)}
  const jm=lumi.y<0,im=I[jm?'jump':'walk'],w=im.width*.5,hh=im.height*.5,y0=G-hh+lumi.y;
  if(jm)ctx.drawImage(im,lumi.x,y0,w,hh);
  else{const ly=Math.round(im.height*LEG),sh=hh*ly/im.height,lh=hh-sh,lw=im.height-ly,hw=im.width/2,st=Math.floor(anim/.14)%2;
   ctx.drawImage(im,0,0,im.width,ly,lumi.x,y0,w,sh);
   ctx.drawImage(im,0,ly,hw,lw,lumi.x+(st?-2:2),y0+sh-(st?0:2),w/2,lh);
   ctx.drawImage(im,hw,ly,hw,lw,lumi.x+w/2+(st?2:-2),y0+sh-(st?2:0),w/2,lh)}
  for(const b of balloons)drawBalloon(b);
  for(const h of hearts){const p=h.t/.9;ctx.globalAlpha=1-p*p;const s=p<.2?18+p*60:30;ctx.drawImage(I.heart,h.x-s/2+8,h.y-p*45-s,s*I.heart.width/I.heart.height,s)}
  for(const q of pops){const p=q.t/1.1;if(!popSpr)popSpr=mkPop();
    const U=1.5,sw=popSpr.width*U,sh=popSpr.height*U,cx=Math.min(W-sw/2-4,Math.max(sw/2+4,q.x));
    ctx.globalAlpha=p<.5?1:1-(p-.5)/.5;
    ctx.drawImage(popSpr,Math.round((cx-sw/2)/U)*U,Math.round((q.y-p*40-sh)/U)*U,sw,sh)}
  ctx.globalAlpha=1;
}
function drawHome(t){const hc=$('hl'),im=I.stand;if(hc.width!==im.width){hc.width=im.width;hc.height=im.height}const c=hc.getContext('2d');c.imageSmoothingEnabled=false;c.clearRect(0,0,hc.width,hc.height);
  const ly=Math.round(im.height*LEG),dy=Math.floor(t/450)%2?4:0;
  c.drawImage(im,0,ly,im.width,im.height-ly,0,ly,im.width,im.height-ly);
  c.drawImage(im,0,0,im.width,ly,0,dy,im.width,ly)}
function loop(t){
  const dt=Math.min(.033,(t-last)/1000||0);last=t;
  if(state==='play')update(dt);
  if(state!=='home')draw();else{ctx.clearRect(0,0,W,H);drawHome(t)}
  requestAnimationFrame(loop);
}
addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();jump()}});
$('screen').addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;jump()});
$('play').onclick=startGame;$('again').onclick=startGame;$('homeBtn').onclick=()=>show('home');
// Pixel-art speech bubble on the home screen (outline + tail built pixel by pixel, text thresholded so it stays crisp)
function drawBubble(){
  // Matches the reference: chunky 2px dark-brown outline, stepped corners, white fill, stepped tail at the bottom right, spaced pixel lettering
  const U=2,BWc=77,BHc=18,TLc=4,TC=48,W=BWc*U,CH=(BHc+TLc)*U,c=$('bubble');c.width=W;c.height=CH;const x=c.getContext('2d'),INK='#4b2f1c';
  const inS=(cx,cy)=>{if(cx<0||cy<0||cx>=BWc)return false;
    if(cy<BHc){const dx=Math.min(cx,BWc-1-cx),dy=Math.min(cy,BHc-1-cy);return dx+dy>=2}
    const r=cy-BHc;return r<TLc&&cx>=TC&&cx<=TC+4-r};
  for(let cy=0;cy<BHc+TLc;cy++)for(let cx=0;cx<BWc;cx++){if(!inS(cx,cy))continue;
    x.fillStyle=(!inS(cx-1,cy)||!inS(cx+1,cy)||!inS(cx,cy-1)||!inS(cx,cy+1))?INK:'#fff';x.fillRect(cx*U,cy*U,U,U)}
  const t=document.createElement('canvas');t.width=W;t.height=BHc*U;const tx=t.getContext('2d');
  tx.font='8px "Press Start 2P", monospace';tx.textAlign='left';tx.textBaseline='top';tx.fillStyle='#000';
  const line=(s,y)=>{let px=Math.round((W-(s.length*9-1))/2);for(const ch of s){tx.fillText(ch,px,y);px+=9}};
  line('happy birthday,',7);line('mommies!',21);
  const d=tx.getImageData(0,0,W,BHc*U).data;x.fillStyle=INK;
  for(let py=0;py<BHc*U;py++)for(let px=0;px<W;px++)if(d[(py*W+px)*4+3]>110)x.fillRect(px,py,1,1);
}
(document.fonts?document.fonts.load('8px "Press Start 2P"','happy birthday, mommies!'):Promise.resolve()).then(drawBubble,drawBubble);
